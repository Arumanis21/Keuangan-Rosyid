<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Rosyid</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        /* Pilihan Warna Modern & Font */
body {
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    background-color: #f8fafc; /* Abu-abu sangat muda agar bersih */
    color: #334155;
}

/* Header yang lebih elegan */
.header {
    background: linear-gradient(135deg, #115e59, #0f766e); /* Gradasi hijau teal/emerald mewah */
    border-radius: 0 0 24px 24px; /* Sudut bawah melengkung halus */
    padding: 25px 20px;
    box-shadow: 0 4px 20px rgba(15, 118, 110, 0.15);
}

/* Kartu Ringkasan (Uang Masuk & Keluar) */
.card-container {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Membagi 2 kolom sejajar agar lebih ringkas di HP */
    gap: 12px;
    padding: 15px;
}

.card {
    background: #ffffff;
    border: 1px solid rgba(226, 232, 240, 0.8);
    border-radius: 16px; /* Sudut melengkung modern */
    padding: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); /* Bayangan sangat halus */
    transition: transform 0.2s;
}

/* Warna aksen khusus kartu */
.card.uang-masuk {
    border-left: 4px solid #10b981; /* Garis hijau di samping */
}
.card.uang-keluar {
    border-left: 4px solid #ef4444; /* Garis merah di samping */
}

/* Form Tambah Transaksi */
.form-container {
    background: #ffffff;
    border-radius: 20px;
    padding: 20px;
    margin: 15px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    background-color: #f8fafc;
    transition: all 0.3s;
}

input:focus, select:focus {
    border-color: #0f766e;
    background-color: #ffffff;
    outline: none;
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
}

/* Tombol Kirim/Simpan */
.btn-submit {
    background-color: #0f766e;
    color: white;
    font-weight: 600;
    padding: 14px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
}

    </style>
</head>
<body>
    <div class="container">
        <!-- Judul Header Website Diubah Menjadi Keuangan Rosyid -->
        <div class="header">
            <h1>📊 Keuangan Rosyid</h1>
            <p>Pencatatan Finansial Harian & Arsip Bulanan</p>
        </div>
        <div class="filter-section">
            <div class="filter-group">
                <label for="month-filter">Periode:</label>
                <input type="month" id="month-filter">
            </div>
            <button onclick="clearAllData()" class="btn-danger">Reset Data</button>
        </div>
        <div class="summary-cards">
            <div class="card card-income">
                <div class="card-title">Total Uang Masuk</div>
                <div id="total-income" class="card-value text-income">Rp 0</div>
            </div>
            <div class="card card-expense">
                <div class="card-title">Total Uang Keluar</div>
                <div id="total-expense" class="card-value text-expense">Rp 0</div>
            </div>
            
        </div>
        <div class="main-layout">
            <div class="form-box">
                <h2>Tambah Transaksi</h2>
                <form id="finance-form">
                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>Jenis</label>
                        <select id="type">
                            <option value="income">💰 Uang Masuk (+)</option>
                            <option value="expense">💸 Uang Keluar (-)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Keterangan</label>
                        <input type="text" id="description" placeholder="Contoh: Gaji, Jajan" required>
                    </div>
                    <div class="form-group">
                        <label>Nominal (Rp)</label>
                        <input type="text" id="amount" placeholder="Contoh: 1.205.000" required>
                    </div>
                    <button type="submit" class="btn-submit">Simpan Transaksi</button>
                </form>
            </div>
            <div class="history-box">
                <h2>Riwayat (<span id="current-view-month">Bulan</span>)</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Keterangan</th>
                                <th class="text-right">Masuk</th>
                                <th class="text-right">Keluar</th>
                                <th class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list"></tbody>
                    </table>
                    <div id="empty-state" class="empty-state hidden">📭 Tidak ada transaksi.</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let transactions = JSON.parse(localStorage.getItem('pwa_finance_db')) || [];
        const form = document.getElementById('finance-form'), dateInput = document.getElementById('date'), descriptionInput = document.getElementById('description'), amountInput = document.getElementById('amount'), typeInput = document.getElementById('type'), transactionList = document.getElementById('transaction-list'), emptyState = document.getElementById('empty-state'), monthFilter = document.getElementById('month-filter'), currentViewMonthText = document.getElementById('current-view-month');
        
        const now = new Date(), currentYear = now.getFullYear(), currentMonth = String(now.getMonth() + 1).padStart(2, '0'), currentDay = String(now.getDate()).padStart(2, '0');
        monthFilter.value = `${currentYear}-${currentMonth}`; dateInput.value = `${currentYear}-${currentMonth}-${currentDay}`;

        function formatRupiah(num) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num); }
        function getIndonesianMonth(str) { if (!str) return ""; const [y, m] = str.split('-'); return new Date(y, m - 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }); }
        
        amountInput.addEventListener('input', function() {
            let val = this.value.replace(/\D/g, '');
            this.value = val ? new Intl.NumberFormat('id-ID').format(val) : '';
        });

        function updateUI() {
            const activeMonth = monthFilter.value;
            currentViewMonthText.innerText = getIndonesianMonth(activeMonth);
            transactionList.innerHTML = '';
            let inc = 0, exp = 0;
            const filtered = transactions.filter(item => item.date.substring(0, 7) === activeMonth).sort((a,b) => new Date(a.date) - new Date(b.date));
            
            if (filtered.length === 0) emptyState.classList.remove('hidden'); else emptyState.classList.add('hidden');
            
            filtered.forEach((tx) => {
                const isInc = tx.type === 'income';
                if (isInc) inc += tx.amount; else exp += tx.amount;
                const d = new Date(tx.date), showD = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
                const row = document.createElement('tr');
