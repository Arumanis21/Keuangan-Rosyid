<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan Rosyid</title>
  <link rel="manifest" href="manifest.json">
  <!-- Pustaka Chart.js untuk grafik tren naik-turun -->
  <script src="https://jsdelivr.net"></script>
  <style>
    :root { 
      --primary: #004d40; 
      --bg: #f4f7f6; 
      --text: #333; 
    }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      margin: 0; 
      background: var(--bg); 
      color: var(--text); 
      padding-bottom: 30px; 
    }
    .header { 
      background: var(--primary); 
      color: white; 
      padding: 25px 20px; 
      border-bottom-left-radius: 20px; 
      border-bottom-right-radius: 20px; 
      text-align: center; 
    }
    .header h1 { 
      margin: 0; 
      font-size: 22px; 
    }
    .header p { 
      margin: 5px 0 0; 
      font-size: 14px; 
      opacity: 0.8; 
    }
    
    .container { 
      padding: 15px; 
      max-width: 500px; 
      margin: auto; 
    }
    
    /* Tombol Navigasi Filter Waktu */
    .filter-nav { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 15px; 
      background: white; 
      padding: 5px; 
      border-radius: 10px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
    }
    .filter-nav button { 
      flex: 1; 
      background: none; 
      border: none; 
      padding: 10px; 
      font-weight: bold; 
      color: #666; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: 0.3s; 
    }
    .filter-nav button.active { 
      background: var(--primary); 
      color: white; 
    }

    /* 2 Kotak Utama Totalan */
    .grid-summary { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
      margin-bottom: 20px; 
    }
    .card { 
      background: white; 
      padding: 15px; 
      border-radius: 12px; 
      box-shadow: 0 3px 8px rgba(0,0,0,0.05); 
      text-align: center; 
      border-top: 4px solid #ccc; 
    }
    .card.masuk { border-top-color: #2ecc71; }
    .card.keluar { border-top-color: #e74c3c; }
    .card h3 { 
      margin: 0; 
      font-size: 13px; 
      color: #777; 
      text-transform: uppercase; 
    }
    .card p { 
      margin: 8px 0 0; 
      font-size: 16px; 
      font-weight: bold; 
      color: #222; 
    }

    /* Area Grafik & Analisis Otomatis */
    .analysis-section { 
      background: white; 
      padding: 15px; 
      border-radius: 12px; 
      box-shadow: 0 3px 8px rgba(0,0,0,0.05); 
      margin-bottom: 20px; 
      display: none; 
    }
    .analysis-text { 
      background: #e8f5e9; 
      padding: 12px; 
      border-radius: 8px; 
      font-size: 13px; 
      color: #2e7d32; 
      line-height: 1.5; 
      margin-top: 15px; 
      border-left: 4px solid #2e7d32; 
    }

    /* Judul Bagian */
    .section-title { 
      font-size: 16px; 
      font-weight: bold; 
      margin: 20px 0 10px; 
      color: var(--primary); 
    }
    
    /* Formulir Input Transaksi */
    .form-group { 
      background: white; 
      padding: 15px; 
      border-radius: 12px; 
      box-shadow: 0 3px 8px rgba(0,0,0,0.05); 
      margin-bottom: 20px; 
    }
    .form-group label { 
      display: block; 
      font-size: 13px; 
      font-weight: bold; 
      margin-bottom: 5px; 
      color: #555; 
    }
    .form-group input, .form-group select { 
      width: 100%; 
      padding: 10px; 
      margin-bottom: 12px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      box-sizing: border-box; 
    }
    .btn-submit { 
      width: 100%; 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 12px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 15px; 
    }
    
    /* List Riwayat Transaksi */
    .transaction-list { 
      background: white; 
      padding: 10px; 
      border-radius: 12px; 
      box-shadow: 0 3px 8px rgba(0,0,0,0.05); 
    }
    .item-tr { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 12px 8px; 
      border-bottom: 1px solid #eee; 
      font-size: 14px; 
    }
    .item-tr:last-child { border-bottom: none; }
    .item-tr .desc { font-weight: 500; }
    .item-tr .date { font-size: 11px; color: #999; margin-top: 2px; }
    .item-tr .amount.masuk { color: #2ecc71; font-weight: bold; }
    .item-tr .amount.keluar { color: #e74c3c; font-weight: bold; }
    .empty-state { 
      text-align: center; 
      color: #999; 
      padding: 20px; 
      font-size: 14px; 
    }
  </style>
</head>
<body>

  <!-- Bagian Header Utama -->
  <div class="header">
    <h1 id="greeting-text">Selamat, Rosyid</h1>
    <p>Selamat menabung, pria tangguh</p>
  </div>

  <div class="container">
    <!-- Filter Navigasi Waktu -->
    <div class="filter-nav">
      <button id="btn-hari" class="active" onclick="switchFilter('hari')">Hari</button>
      <button id="btn-bulan" onclick="switchFilter('bulan')">Bulan</button>
      <button id="btn-semua" onclick="switchFilter('semua')">Semua</button>
    </div>

    <!-- Tampilan 2 Kotak Saldo -->
    <div class="grid-summary">
      <div class="card masuk">
        <h3>Total Uang Masuk</h3>
        <p id="total-masuk">Rp 0</p>
      </div>
      <div class="card keluar">
        <h3>Total Uang Keluar</h3>
        <p id="total-keluar">Rp 0</p>
      </div>
    </div>

    <!-- Grafik dan Analisis Tren Bulanan (Hanya aktif ketika tombol 'Semua' diklik) -->
    <div id="analysis-wrapper" class="analysis-section">
      <div class="section-title" style="margin-top:0;">Ringkasan Tabungan Masuk dan Keluar</div>
      <canvas id="trendChart" style="width: 100%; height: 200px;"></canvas>
      <div id="analysis-text-box" class="analysis-text">
        Menganalisis pergerakan saldo bulanan Anda...
      </div>
    </div>

    <!-- Formulir Input Tambah Data -->
    <div class="section-title">Tambah Transaksi</div>
    <div class="form-group">
      <form id="tx-form" onsubmit="saveTransaction(event)">
        <label>Tanggal</label>
        <input type="date" id="tx-date" required>
        
        <label>Jenis</label>
        <select id="tx-type">
          <option value="masuk">💰 Uang Masuk (+)</option>
          <option value="keluar">💸 Uang Keluar (-)</option>
        </select>
        
        <label>Keterangan</label>
        <input type="text" id="tx-desc" placeholder="Contoh: Gaji bulanan, Jajan sore" required>
        
        <label>Nominal (Rp)</label>
        <input type="number" id="tx-nominal" placeholder="Contoh: 1205000" required>
        
        <button type="submit" class="btn-submit">Simpan Transaksi</button>
      </form>
    </div>

    <!-- Riwayat Data Log Transaksi -->
    <div class="section-title">Data Transaksi Riwayat</div>
    <div id="transaction-container" class="transaction-list">
      <!-- Data log harian otomatis muncul di sini -->
    </div>
  </div>

  <script>
    // Inisialisasi Database Internal Browser (LocalStorage)
    let transactions = JSON.parse(localStorage.getItem('rosyid_finance_data')) || [];
    let currentFilter = 'hari';
    let myChart = null;

    // 1. Fungsi Mengatur Ucapan Sesuai Waktu HP
    function initGreeting() {
      const hours = new Date().getHours();
      let greeting = "Selamat Malam, Rosyid";
      
      if (hours >= 5 && hours < 11) greeting = "Selamat Pagi, Rosyid";
      else if (hours >= 11 && hours < 15) greeting = "Selamat Siang, Rosyid";
      else if (hours >= 15 && hours < 18) greeting = "Selamat Sore, Rosyid";
      
      document.getElementById('greeting-text').innerText = greeting;
      document.getElementById('tx-date').valueAsDate = new Date();
    }

    // 2. Format Konversi ke Mata Uang Rupiah
    function formatRupiah(angka) {
      return 'Rp ' + parseInt(angka).toLocaleString('id-ID');
    }

    // 3. Fungsi Menyimpan Data Transaksi Baru
    function saveTransaction(e) {
      e.preventDefault();
      const date = document.getElementById('tx-date').value;
      const type = document.getElementById('tx-type').value;
      const desc = document.getElementById('tx-desc').value;
      const nominal = parseFloat(document.getElementById('tx-nominal').value);

      transactions.push({ id: Date.now(), date, type, desc, nominal });
      localStorage.setItem('rosyid_finance_data', JSON.stringify(transactions));
      
      document.getElementById('tx-desc').value = '';
      document.getElementById('tx-nominal').value = '';
      
      renderDashboard();
    }

    // 4. Logika Pengendali Tombol Navigasi Filter
    function switchFilter(filterType) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-nav button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${filterType}`).classList.add('active');
      renderDashboard();
    }

    // 5. Fungsi Render Menampilkan Komponen Data di Layar
    function renderDashboard() {
      const todayObj = new Date();
      const todayStr = todayObj.toISOString().split('T')[0]; // Format YYYY-MM-DD
      const thisMonthStr = todayStr.substring(0, 7); // Format YYYY-MM
      
      let filtered = [];
      if (currentFilter === 'hari') {
        filtered = transactions.filter(t => t.date === todayStr);
        document.getElementById('analysis-wrapper').style.display = 'none';
      } else if (currentFilter === 'bulan') {
        filtered = transactions.filter(t => t.date.startsWith(thisMonthStr));
        document.getElementById('analysis-wrapper').style.display = 'none';
      } else {
        filtered = transactions;
        document.getElementById('analysis-wrapper').style.display = 'block';
        renderChartAndAnalysis();
      }

      // Hitung Total 2 Kotak Atas
      let totalMasuk = 0;
      let totalKeluar = 0;
      filtered.forEach(t => {
